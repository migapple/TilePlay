<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<title>Tuiles Numériques</title>
<style>
:root{--bg:#1a1a2e;--green:#2d6a2d;--gdark:#1a4a1a;--gold:#FFD700}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--bg)}
#app{position:fixed;top:0;left:0;right:0;bottom:0;display:flex;flex-direction:column;background:var(--bg);overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Helvetica Neue',sans-serif}

#topbar{
  padding-top:calc(12px + env(safe-area-inset-top));
  padding-left:14px;padding-right:14px;padding-bottom:10px;
  display:flex;align-items:center;justify-content:space-between;flex-shrink:0;
}
#topbar.p1{background:#0d3b6e}
#topbar.p2{background:#6e2a0d}
.badge{padding:5px 16px;border-radius:20px;font-weight:700;font-size:14px}
.bp1{background:#185FA5;color:#fff}
.bp2{background:#D85A30;color:#fff}
.sc{display:flex;gap:14px;font-size:13px;color:rgba(255,255,255,.85)}
.sc b{font-weight:700}
.sc small{opacity:.55;font-size:11px}
#tnum{font-size:12px;color:rgba(255,255,255,.55)}
@media(min-width:768px){
  #apptitle{font-size:20px!important}
  .badge{font-size:17px;padding:6px 20px}
  .sc{font-size:16px;gap:18px}
  .sc small{font-size:13px}
  #tnum{font-size:15px}
  #bai{font-size:13px!important;padding:4px 10px!important}
}
@media(min-width:1024px){
  #apptitle{font-size:24px!important}
  .badge{font-size:20px;padding:8px 24px}
  .sc{font-size:19px;gap:22px}
  .sc small{font-size:15px}
  #tnum{font-size:17px}
  #bai{font-size:15px!important;padding:5px 12px!important}
}

#board{flex:1;background:var(--green);border-top:2px solid var(--gdark);border-bottom:2px solid var(--gdark);overflow-y:auto;-webkit-overflow-scrolling:touch;padding:10px;min-height:0}
#hint{font-size:11px;color:rgba(255,255,255,.7);margin-bottom:8px;line-height:1.4}
#hint b{color:var(--gold)}
#sets{display:flex;flex-wrap:wrap;gap:10px;align-content:flex-start;min-height:100px}

.bset{display:flex;gap:3px;padding:6px 8px;background:rgba(0,0,0,.28);border:1.5px solid rgba(255,255,255,.2);border-radius:10px;flex-wrap:nowrap;cursor:pointer;align-items:flex-end}
.bset.drop{border-color:var(--gold);border-style:dashed;background:rgba(255,215,0,.08)}
.bset.ai-new{border-color:#4ade80!important;border-width:2px!important;background:rgba(74,222,128,.1)!important;box-shadow:0 0 8px rgba(74,222,128,.4)}
.tile.ai-placed{outline:2px solid #4ade80!important;outline-offset:2px;box-shadow:0 0 6px rgba(74,222,128,.6)!important}

/* TUILE */
.tile{width:42px;height:56px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:18px;cursor:pointer;border:2px solid rgba(0,0,0,.2);box-shadow:0 2px 5px rgba(0,0,0,.4);flex-shrink:0;-webkit-user-select:none;user-select:none;transition:transform .12s,box-shadow .12s,outline .1s}
@media(min-width:768px){
  .tile{width:54px;height:72px;border-radius:10px;font-size:22px}
  .bset{gap:4px;padding:8px 10px}
  #sets,#sets2{gap:12px}
  #htiles{gap:7px}
  .btn{padding:10px 18px;font-size:15px}
  #bnew{width:46px;height:46px;font-size:26px}
  #bsplit,#bnewset2{font-size:16px}
}
@media(min-width:1024px){
  .tile{width:62px;height:82px;border-radius:12px;font-size:26px}
  .bset{gap:5px;padding:10px 12px}
}
.tile.sel{transform:translateY(-9px);box-shadow:0 10px 20px rgba(0,0,0,.45);outline:3px solid var(--gold);outline-offset:1px}
.tile.nw{outline:3px solid #4CAF50;outline-offset:2px}
.tile[data-c=red]{background:#C62828;color:#fff;border-color:#7f0000}
.tile[data-c=blue]{background:#1976D2;color:#fff;border-color:#0D47A1}
.tile[data-c=black]{background:#212121;color:#fff;border-color:#000}
.tile[data-c=orange]{background:#FF8F00;color:#fff;border-color:#E65100}
.tile[data-c=joker]{background:linear-gradient(135deg,#7B1FA2,#1565C0);color:var(--gold);border-color:#4A148C;font-size:22px}

/* sélection multiple : compteur sur la tuile */
.tile.sel::before{content:attr(data-selnum);position:absolute;top:-6px;right:-6px;background:var(--gold);color:#000;font-size:10px;font-weight:900;width:16px;height:16px;border-radius:50%;display:flex;align-items:center;justify-content:center;line-height:16px;text-align:center}
.tile{position:relative}

#hand{flex-shrink:0;background:#111827;border-top:1.5px solid #2d3748;padding:8px 14px 0}
#hmeta{display:flex;justify-content:space-between;align-items:center;margin-bottom:7px}
#htitle{font-size:12px;font-weight:600;color:rgba(255,255,255,.65);text-transform:uppercase;letter-spacing:.5px}
#sinfo{font-size:11px;font-weight:600;color:var(--gold)}
#htiles{display:flex;flex-wrap:wrap;gap:5px;padding-bottom:10px;min-height:66px}

#act{flex-shrink:0;background:#0f172a;border-top:1px solid #1e293b;padding:8px 10px;padding-bottom:calc(8px + env(safe-area-inset-bottom));display:flex;gap:4px;align-items:center;flex-wrap:nowrap}
.btn{padding:8px 0;border-radius:22px;font-size:14px;font-weight:600;cursor:pointer;border:none;flex:1;text-align:center;min-width:0}
.btn:active{opacity:.75}
#bval{background:#2E7D32;color:#fff}
#bnew{background:#7B1FA2;color:#fff;width:40px;height:40px;padding:0;border-radius:50%;font-size:24px;line-height:40px;text-align:center}
#bnew:disabled{background:#374151;color:#6b7280;cursor:not-allowed}
#bdraw{background:#1565C0;color:#fff}
#bswitch{background:#b45309;color:#fff}
#bcancel{background:#7f1d1d;color:#fff}
#msg{font-size:12px;color:#f87171;flex:1;text-align:right;line-height:1.3}

#passov{display:none;position:fixed;inset:0;z-index:100;background:rgba(0,0,0,.93);flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px}
#passov.on{display:flex}
#pwho{font-size:22px;font-weight:700;color:var(--gold);text-align:center}
#pok{padding:14px 36px;background:#185FA5;color:#fff;border:none;border-radius:26px;font-size:16px;font-weight:700;cursor:pointer}

#winov{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.95);flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px}
#winov.on{display:flex}
#wmsg{font-size:22px;font-weight:700;color:var(--gold);text-align:center;line-height:1.5;white-space:pre-line}
#wrep{padding:14px 36px;background:#185FA5;color:#fff;border:none;border-radius:26px;font-size:16px;font-weight:700;cursor:pointer}
</style>
</head>
<body>
<div id="app">
  <div id="topbar" class="p1">
    <div style="display:flex;align-items:center;gap:8px"><div id="tnum">Tour 1</div><button id="bai" onclick="toggleAI()" style="background:none;border:1px solid rgba(255,255,255,.3);border-radius:12px;font-size:11px;font-weight:700;color:rgba(255,255,255,.7);cursor:pointer;padding:3px 7px;line-height:1">IA</button> <button id="blang" onclick="toggleLang()" style="background:none;border:none;font-size:18px;cursor:pointer;padding:0;line-height:1">🇬🇧</button></div>
    <div id="apptitle" style="font-size:16px;font-weight:800;color:#fff;letter-spacing:1px">Tuiles Numériques</div>

        <div id="j1circle" style="width:28px;height:28px;border-radius:50%;background:#185FA5;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid transparent">J1</div>
        <span id="s1" style="font-weight:700;color:#fff">0</span><span style="opacity:.6;font-size:11px">pts</span><span id="s1p" style="color:#4ade80;font-size:11px;font-weight:700;display:none"></span>
      </div>
      <div id="p2ind" style="display:flex;align-items:center;gap:6px">
        <div id="j2circle" style="width:28px;height:28px;border-radius:50%;background:#D85A30;display:flex;align-items:center;justify-content:center;font-size:11px;font-weight:700;color:#fff;border:2px solid transparent">J2</div>

  <div id="board" onclick="boardBgClick(event)">

    </div>

    <div style="border-top:2px dashed rgba(255,255,255,0.18);margin:4px 0 6px"></div>
    <!-- Zone Joueur 1 en bas -->
    <div style="display:flex;align-items:center;gap:6px;margin-bottom:5px">
      <div id="z1label" style="font-size:10px;font-weight:700;color:rgba(96,165,250,.7);text-transform:uppercase;letter-spacing:1px;white-space:nowrap">J1</div>
      <div style="flex:1;height:1px;background:rgba(96,165,250,.25)"></div>
    </div>
    <div id="hint"></div>
    <div id="sets"></div>
  </div>

  <div id="hand">
    <div id="hmeta"><div id="htitle">Main — Joueur 1</div><div id="sinfo"></div></div>
    <div id="htiles"></div>
  </div>

  <div id="act">
    <button class="btn" id="bval" onclick="doValidate()" title="Valider">✓</button>
    <button class="btn" id="bsplit" onclick="doSplit()" style="display:none;background:#0e7490;color:#fff" title="Couper le set ici">✂</button>
    <button class="btn" id="bnewset2" onclick="doNewSet()" style="display:none;background:#166534;color:#fff" title="Nouveau set">▣</button>
    <button class="btn" id="bdraw" onclick="doDraw()" title="Piocher">🂠</button>

    <button class="btn" id="bundo" onclick="doUndo()" disabled style="background:#374151;color:#d1d5db" title="Undo">↩</button>
    <button class="btn" id="bnewgame" onclick="confirmNewGame()" style="background:#374151;color:#d1d5db" title="Nouvelle partie">↺</button>
    <button class="btn" id="bhint" onclick="showHint()" style="background:#854d0e;color:#fef08a" title="Combinaisons possibles">💡</button>
    <button class="btn" id="bscores" onclick="showScores()" style="background:#374151;color:#d1d5db" title="Scores">🏅</button>
    <button class="btn" id="bspy" onclick="toggleSpy()" style="background:#7c3aed;color:#fff" title="Voir jeu IA">👁</button>
    <button class="btn" id="bhelp" onclick="showHelp()" style="background:#374151;color:#d1d5db" title="Aide">?</button>
    <button class="btn" id="bapps" onclick="showApps()" style="background:#374151;color:#d1d5db" title="Nos apps">📱</button>

</div>

<!-- CONFIRM NOUVELLE PARTIE -->
<div id="confirmov" style="display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.85);flex-direction:column;align-items:center;justify-content:center;gap:20px;padding:40px">
  <div style="font-size:22px;font-weight:700;color:#fff;text-align:center" id="confirm-msg">Nouvelle partie ?</div>

<!-- MODAL AIDE -->

    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:20px">
      <div id="help-title" style="font-size:20px;font-weight:700;color:var(--gold)">Aide — TilePlay</div>
      <button onclick="closeHelp()" style="background:none;border:none;color:rgba(255,255,255,.7);font-size:28px;cursor:pointer;line-height:1">✕</button>
    </div>

</div>

<div id="passov">
  <div style="font-size:52px">🙈</div>
  <div id="pwho"></div>
  <div id="pass-sub" style="font-size:14px;color:rgba(255,255,255,.5)">La main adverse est cachée.</div>
  <button id="pok" onclick="doAfterPass()">Je suis prêt !</button>
</div>

<div id="hintov" style="display:none;position:fixed;inset:0;z-index:300;background:rgba(0,0,0,.93);overflow-y:auto;-webkit-overflow-scrolling:touch">
  <div style="max-width:480px;margin:0 auto;padding:calc(20px + env(safe-area-inset-top)) 16px calc(20px + env(safe-area-inset-bottom))">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:18px;font-weight:700;color:#fef08a">💡 <span id="hint-title">Combinaisons possibles</span></div>
      <button onclick="closeHint()" style="background:none;border:none;color:rgba(255,255,255,.7);font-size:28px;cursor:pointer;line-height:1">✕</button>

<!-- SCORES -->

  <div style="max-width:420px;margin:0 auto;padding:calc(24px + env(safe-area-inset-top)) 16px calc(24px + env(safe-area-inset-bottom))">
    <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:16px">
      <div style="font-size:18px;font-weight:700;color:var(--gold)">🏅 Scores</div>
      <button onclick="closeScores()" style="background:none;border:none;color:rgba(255,255,255,.7);font-size:28px;cursor:pointer;line-height:1">✕</button>
    </div>

    <div style="margin-top:16px">
      <button onclick="resetScores()" style="width:100%;padding:11px;background:#7f1d1d;color:#fff;border:none;border-radius:22px;font-size:14px;font-weight:700;cursor:pointer">🗑 Remettre à 0</button>
    </div>
  </div>
</div>

<div id="winov">
  <div style="font-size:64px">🏆</div>
  <div id="wmsg"></div>
</div>

<script>
const COLS=['red','blue','black','orange'];
const LBL={red:'Rouge',blue:'Bleu',black:'Noir',orange:'Orange'};

let G={};

function makeTiles(){
  const t=[];
  for(const c of COLS)for(let n=1;n<=13;n++){
    t.push({c,n,id:c+'_'+n+'_a'});
    t.push({c,n,id:c+'_'+n+'_b'});
  }
  t.push({c:'joker',n:0,id:'joker_1'},{c:'joker',n:0,id:'joker_2'});
  return t;
}
function shuffle(a){
  const b=[...a];
  for(let i=b.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[b[i],b[j]]=[b[j],b[i]];}
  return b;
}
function dc(o){return JSON.parse(JSON.stringify(o));}

function initGame(){
  const tiles=shuffle(makeTiles());
  G={
    pool:[...tiles],
    hands:[[],[]],
    board:[],
    allTiles:{},
    bkBoard:[],
    bkHand:[],
    curP:0,
    turn:1,
    scores:[0,0],
    firstPlay:[true,true],
    history:[],    // pile de snapshots {board, hand} pour undo
    sel:[],
    drawnId:null,
    drew:false,
    jokerMustPlay:null,
    nextP:1,
    has30:false,
    aiMode:true,
    aiJustDrew:0,
    aiNewSets:[],
    spyMode:false,
    aiAddedIds:[]
  };
  tiles.forEach(t=>{G.allTiles[t.id]=t;});
  for(let i=0;i<14;i++){
    G.hands[0].push(G.pool.pop().id);
    G.hands[1].push(G.pool.pop().id);
  }
  G.bkBoard=[];
  G.bkHand=dc(G.hands[0]);
  document.getElementById('passov').classList.remove('on');
  document.getElementById('winov').classList.remove('on');
  render();
  setMsg('');
  // Sync bouton IA avec état initial
  const bai=document.getElementById('bai');
  if(bai){bai.style.color=G.aiMode?'#4ade80':'rgba(255,255,255,.7)';bai.style.borderColor=G.aiMode?'#4ade80':'rgba(255,255,255,.3)';bai.textContent=G.aiMode?'IA ✓':'IA';}
}

/* ── Validation ── */
function tilesOf(ids){return ids.map(id=>G.allTiles[id]);}

function isRun(ids){
  // Valide une suite en tenant compte de l'ORDRE des tuiles
  if(ids.length<3)return false;
  const set=tilesOf(ids);
  const nonJ=set.filter(t=>t.c!=='joker');
  if(nonJ.length===0)return true;
  if(new Set(nonJ.map(t=>t.c)).size!==1)return false;
  const len=ids.length;
  // Assigner une valeur à chaque tuile selon sa position dans le set
  // On cherche le start tel que set[i] = start+i (jokers acceptent n'importe quelle valeur)
  // On déduit start depuis les non-jokers
  const candidates=new Set();
  set.forEach((t,i)=>{ if(t.c!=='joker') candidates.add(t.n-i); });
  for(const start of candidates){
    if(start<1)continue; // commence avant 1
    if(start+len-1>13)continue; // finit après 13
    // vérifier que chaque non-joker correspond
    const ok=set.every((t,i)=>t.c==='joker'||t.n===start+i);
    if(ok)return true;
  }
  return false;
}
function isGroup(ids){
  if(ids.length<3||ids.length>4)return false;
  const set=tilesOf(ids);
  const nonJ=set.filter(t=>t.c!=='joker');
  if(nonJ.length===0)return true;
  if(new Set(nonJ.map(t=>t.n)).size!==1)return false;
  return new Set(nonJ.map(t=>t.c)).size===nonJ.length;
}
function isValid(ids){
  if(!ids||ids.length<3)return false;
  return isRun(ids)||isGroup(ids);
}

function placedPts(){
  const pids=placedIds();
  return pids.reduce((a,id)=>{
    const entry=G.board.find(e=>e.ids.includes(id));
    return a+tileScore(id,entry?entry.ids:null);
  },0);
}
function computeHas30(){
  if(!G.firstPlay[G.curP])return true;
  const pts=placedPts();
  return pts>=30;
}

/* ── Render ── */
function render(){
  const p=G.curP;
  document.getElementById('topbar').className=p===0?'p1':'p2';
  document.getElementById('tnum').textContent=t().tour+' '+G.turn;
  updateStaticText();
  const at=document.getElementById('apptitle');
  if(at)at.textContent=LANG==='fr'?'Tuiles Numériques':'Number Tiles';
  // labels zones tapis
  const z1=document.getElementById('z1label');
  const z2=document.getElementById('z2label');
  if(z1){z1.style.opacity=G.curP===0?'1':'0.4';}
  if(z2){z2.style.opacity=G.curP===1?'1':'0.4';}
  // cercle actif
  const c1=document.getElementById('j1circle');
  const c2=document.getElementById('j2circle');
  c1.style.border=G.curP===0?'2px solid #fff':'2px solid transparent';
  c1.style.boxShadow=G.curP===0?'0 0 8px rgba(255,255,255,.6)':'none';
  c2.style.border=G.curP===1?'2px solid #fff':'2px solid transparent';
  c2.style.boxShadow=G.curP===1?'0 0 8px rgba(255,255,255,.6)':'none';
  document.getElementById('s1').textContent=G.scores[0];
  document.getElementById('s2').textContent=G.scores[1];
  // points en cours ce tour
  const pendingPts=placedPts();
  const hasFirstPlay=G.firstPlay[G.curP];
  const p1p=document.getElementById('s1p');
  const p2p=document.getElementById('s2p');
  [p1p,p2p].forEach(el=>el.style.display='none');
  if(pendingPts>0){
    const el=G.curP===0?p1p:p2p;
    el.textContent=' +'+pendingPts+(hasFirstPlay&&pendingPts<30?' ('+pendingPts+'/30)':'');
    el.style.display='';
    el.style.color=(!hasFirstPlay||pendingPts>=30)?'#4ade80':'#fbbf24';
  }
  // débloquer sets adverses si 30pts atteints cette pose
  G.has30=computeHas30();
  document.getElementById('htitle').textContent=t().main+' — '+t().joueur+' '+(G.curP+1);

  // hint
  const hint=document.getElementById('hint');
  const sinfo=document.getElementById('sinfo');
  if(G.sel.length>0){
    const lbls=G.sel.map(id=>{const t=G.allTiles[id];return t.c==='joker'?'★':(LBL[t.c]+' '+t.n);});
    hint.innerHTML=t().hint_sel(lbls.join(', '));
    sinfo.textContent=G.sel.length+' tuile'+(G.sel.length>1?'s':'')+' sélectionnée'+(G.sel.length>1?'s':'');
  } else if(G.drew){
    hint.innerHTML=t().hint_drew;
    sinfo.textContent='';
  } else {
    hint.innerHTML=t().hint_default;
    sinfo.textContent='';
  }

  document.getElementById('bdraw').style.display=G.drew?'none':'';
  document.getElementById('bswitch').style.display=G.drew?'':'none';

  // plateau — sets J1 en bas, sets J2 en haut (retournés)
  // G.board = [{owner:0|1, ids:[...]}]
  const sc1=document.getElementById('sets');
  const sc2=document.getElementById('sets2');
  sc1.innerHTML='';sc2.innerHTML='';
  G.board.forEach((entry,si)=>{
    const d=document.createElement('div');
    d.className='bset'+(G.sel.length>0?' drop':'')+(entry.aiNew?' ai-new':'');
    entry.ids.forEach((id,ti)=>d.appendChild(makeBoardTileEl(id,si,ti)));
    // zone drop à la fin — toujours visible quand sélection active
    if(G.sel.length>0){
      const dropZone=document.createElement('div');
      const tileH=window.innerWidth>=1024?82:window.innerWidth>=768?72:56;
      const tileW=window.innerWidth>=1024?62:window.innerWidth>=768?54:42;
      dropZone.style.cssText='min-width:'+tileW+'px;min-height:'+tileH+'px;display:flex;align-items:center;justify-content:center;color:var(--gold);font-size:24px;font-weight:700;cursor:pointer;flex-shrink:0;background:rgba(255,215,0,.15);border-radius:6px;margin-left:4px;border:1.5px dashed rgba(255,215,0,.5)';
      dropZone.textContent='→';
      dropZone.title='Ajouter à ce set';
      dropZone.addEventListener('click',e=>{
        e.stopPropagation();
        if(!computeHas30()&&entry.owner!==G.curP){setMsg(t().err_30first);return;}
        appendToSet(si);
      });
      d.appendChild(dropZone);
    }
    // owner 1 → zone du haut (retournée)
    (entry.owner===1?sc2:sc1).appendChild(d);
  });

  // main
  sortHand(p);
  const ht=document.getElementById('htiles');
  ht.innerHTML='';
  G.hands[p].forEach((id,i)=>ht.appendChild(makeHandTileEl(id,i)));
  // main vide avec tuiles posées → inviter à valider
  if(G.hands[p].length===0&&placedIds().length>0){
    const msg=LANG==='fr'?'✓ Main vide — cliquez Valider pour gagner !':'✓ Hand empty — tap Validate to win!';
    const tip=document.createElement('div');
    tip.style.cssText='color:#4ade80;font-weight:700;font-size:13px;padding:6px 0;animation:pulse 1s infinite';
    tip.textContent=msg;
    ht.appendChild(tip);
  }
  // bouton ✂ : visible si exactement 1 tuile du plateau sélectionnée
  const splitBtn=document.getElementById('bsplit');
  const newsetBtn=document.getElementById('bnewset2');
  if(splitBtn){
    const selOnBoard=G.sel.length===1&&G.board.some(e=>e.ids.includes(G.sel[0]));
    splitBtn.style.display=selOnBoard?'':'none';
  }
  if(newsetBtn)newsetBtn.style.display=G.sel.length>0?'':'none';
}

function sortHand(p){
  G.hands[p].sort((a,b)=>{
    const ta=G.allTiles[a],tb=G.allTiles[b];
    if(ta.c==='joker'&&tb.c!=='joker')return 1;
    if(tb.c==='joker'&&ta.c!=='joker')return-1;
    const ci=COLS.indexOf(ta.c)-COLS.indexOf(tb.c);
    return ci!==0?ci:ta.n-tb.n;
  });
}

function makeTileEl(id){
  const t=G.allTiles[id];
  const d=document.createElement('div');
  d.className='tile';
  d.dataset.c=t.c;
  d.textContent=t.c==='joker'?'★':t.n;
  d.title=id; // DEBUG: affiche l'id au survol
  const selIdx=G.sel.indexOf(id);
  if(selIdx>=0){
    d.classList.add('sel');
    // pas de numéro sur les tuiles sélectionnées
  }
  if(G.drawnId===id)d.classList.add('nw');
  return d;
}

function makeHandTileEl(id){
  const d=makeTileEl(id);
  d.addEventListener('click',e=>{
    e.stopPropagation();
    const idx=G.sel.indexOf(id);
    if(idx>=0){
      // désélectionner
      G.sel.splice(idx,1);
    } else {
      // ajouter à la sélection
      G.sel.push(id);
    }
    render();setMsg('');
  });
  return d;
}

function makeBoardTileEl(id,si,ti){
  const d=makeTileEl(id);
  if(G.aiAddedIds.some(a=>a.si===si&&a.ti===ti))d.classList.add('ai-placed');
  d.addEventListener('click',e=>{
    e.stopPropagation();
    if(G.sel.length>0&&!G.sel.includes(id)){
      const entry=G.board[si];
      const setIds=entry.ids;
      const clickedTile=G.allTiles[id];

      // ── Récupération joker : clic sur joker avec sélection ──
      if(clickedTile.c==='joker'){
        if(!computeHas30()&&entry.owner!==G.curP){setMsg(t().err_adv);render();return;}
        const setTiles=setIds.map(tid=>G.allTiles[tid]);
        const nonJ=setTiles.filter(t=>t.c!=='joker');
        const selTiles=G.sel.map(tid=>G.allTiles[tid]);
        // Autorisé si : suite (isRun) avec 1 tuile sélectionnée qui compléte correctement
        // OU groupe de 4 couleurs identiques
        // Groupe : toutes les tuiles sélectionnées + nonJ doivent former un groupe de 4
        const wouldBeGroup=(()=>{
          // on retire le joker et on ajoute les tuiles sélectionnées
          const resultIds=[...setIds.filter(x=>x!==id),...G.sel];
          if(resultIds.length!==4)return false;
          return isGroup(resultIds);
        })();
        // Pour une suite : la tuile posée doit permettre de retirer le joker
        // = vérifier que sans le joker + avec la nouvelle tuile c est toujours une suite valide
        const wouldBeRun=(()=>{
          if(G.sel.length!==1||selTiles[0].c==='joker')return false;
          // tentative : remplacer joker par selTiles[0]
          const testIds=setIds.map(x=>x===id?G.sel[0]:x);
          return isRun(testIds);
        })();
        if(!wouldBeGroup && !wouldBeRun){
          // Pas une récupération valide → ajouter à la sélection comme tuile normale
          G.sel.push(id);
          render();setMsg('');return;
        }
        saveSnap();
        if(removeSelFromSources()===false)return;
        const pos=G.board[si].ids.indexOf(id);
        G.board[si].ids.splice(pos,1);
        G.hands[G.curP].push(id);
        G.board[si].ids.splice(pos,0,...G.sel);
        G.sel=[];
        G.jokerMustPlay=id; // le joker récupéré doit être rejoué ce tour
        setMsg(t().joker_ok);
        render();return;
      }

      // ── Placement début ou fin, sélection au milieu ──
      const lastTi=setIds.length-1;
      const selHasBoardTile=G.sel.some(sid=>G.board.some(e=>e.ids.includes(sid)));
      if(selHasBoardTile){
        // Sélection contient du plateau → toujours ajouter à la sélection
        G.sel.push(id);
        render();setMsg('');
      } else if(ti===0||ti===lastTi){
        // sélection vient de la main → placement début/fin
        // Si le set contient un joker, tester avec le sel au début ET à la fin sans retrier
        const hasJokerInBoard=setIds.some(sid=>G.allTiles[sid]&&G.allTiles[sid].c==='joker');
        const testStart=[...G.sel,...setIds];
        const testEnd=[...setIds,...G.sel];
        const testSorted=sortSetIds([...setIds,...G.sel]);
        let finalTestIds;
        if(hasJokerInBoard){
          if(isValid(testStart))finalTestIds=testStart;
          else if(isValid(testEnd))finalTestIds=testEnd;
          else{setMsg(t().err_invalid);render();return;}
        } else {
          if(!isValid(testSorted)){setMsg(t().err_invalid);render();return;}
          finalTestIds=testSorted;
        }
        if(!computeHas30()&&entry.owner!==G.curP){setMsg(t().err_adv);render();return;}
        saveSnap();
        if(removeSelFromSources()===false)return;
        G.board[si].ids=finalTestIds;
        G.sel=[];render();setMsg('');
      } else {
        // milieu → ajouter à la sélection
        G.sel.push(id);
        render();setMsg('');
      }
    } else {
      // sélectionner/désélectionner
      const idx=G.sel.indexOf(id);
      if(idx>=0)G.sel.splice(idx,1);
      else G.sel.push(id);
      setMsg('');render();
    }
  });
  return d;
}

/* ── Manipulation ── */
function canRemoveFromBoard(ids, toRemove){
  // Vérifie que retirer les tuiles 'toRemove' d'un set laisse au moins 0 tuile
  // Si le set résultant a 1 ou 2 tuiles, ce n'est valide que si == 0 (set supprimé)
  // Règle : doit rester 0 ou >=3 tuiles valides
  const remaining=ids.filter(id=>!toRemove.includes(id));
  if(remaining.length===0)return true; // set vide → supprimé
  if(remaining.length<3)return false;  // 1 ou 2 tuiles → invalide
  return isValid(remaining);           // doit rester valide
}

function removeSelFromSources(){
  // Retirer sans vérification intermédiaire — la validation finale au ✓ vérifiera tout
  G.sel.forEach(id=>{
    const hi=G.hands[G.curP].indexOf(id);
    if(hi>=0){G.hands[G.curP].splice(hi,1);return;}
    for(let si=0;si<G.board.length;si++){
      const ti=G.board[si].ids.indexOf(id);
      if(ti>=0){
        G.board[si].ids.splice(ti,1);
        if(G.board[si].ids.length===0)G.board.splice(si,1);
        return;
      }
    }
  });
  return true;
}

/* ── Historique undo ── */
function saveSnap(){
  G.history.push({board:dc(G.board), hand:dc(G.hands[G.curP]), bkBoard:dc(G.bkBoard), bkHand:dc(G.bkHand)});
  if(G.history.length>20)G.history.shift();
  document.getElementById('bundo').disabled=false;
}

function doUndo(){
  if(G.history.length===0){setMsg(t().undo_empty);return;}
  const snap=G.history.pop();
  G.board=snap.board;
  G.hands[G.curP]=snap.hand;
  G.bkBoard=snap.bkBoard;
  G.bkHand=snap.bkHand;
  G.jokerMustPlay=null;
  G.sel=[];
  document.getElementById('bundo').disabled=G.history.length===0;
  render();setMsg('');
}

function smartSortIds(existingIds, newIds){
  // Toujours trier avec sortSetIds — intercale le joker au bon trou dans la suite
  // (le joker en tête n'est respecté que dans doNewSet pour les sets entièrement nouveaux)
  return sortSetIds([...existingIds,...newIds]);
}
function sortSetIds(ids){
  // Trier les ids d'un set : non-jokers par chiffre, jokers intercalés aux trous
  const tiles=ids.map(id=>({id,...G.allTiles[id]}));
  const nonJ=tiles.filter(t=>t.c!=='joker').sort((a,b)=>a.n-b.n);
  const jokers=tiles.filter(t=>t.c==='joker');
  if(nonJ.length===0)return ids;
  // groupe : jokers à la fin
  if(new Set(nonJ.map(t=>t.n)).size===1)return [...nonJ,...jokers].map(t=>t.id);
  // suite : intercaler les jokers aux trous
  const result=[];
  let ji=0;
  for(let i=0;i<nonJ.length;i++){
    if(i>0){
      const gap=nonJ[i].n-nonJ[i-1].n-1;
      for(let g=0;g<gap&&ji<jokers.length;g++,ji++)result.push(jokers[ji].id);
    }
    result.push(nonJ[i].id);
  }
  while(ji<jokers.length)result.push(jokers[ji++].id);
  return result;
}

function appendToSet(si){
  if(G.sel.length===0)return;
  const entry=G.board[si];
  const setIds=entry.ids;
  const selTiles=G.sel.map(id=>G.allTiles[id]);
  const nonJ=setIds.map(id=>G.allTiles[id]).filter(t=>t.c!=='joker');
  // groupe : vérif chiffre identique + max 4
  if(isGroup(setIds)&&!isRun(setIds)){
    if(nonJ.length>0){
      const groupNum=nonJ[0].n;
      if(selTiles.find(t=>t.c!=='joker'&&t.n!==groupNum)){setMsg(t().err_group_num);return;}
    }
    if(setIds.length+G.sel.length>4){setMsg(t().err_group_max);return;}
  }
  // trier le résultat final (isRun est positionnel)
  const testIds=sortSetIds([...setIds,...G.sel]);
  if(!isValid(testIds)){setMsg(t().err_invalid);return;}
  saveSnap();
  if(removeSelFromSources()===false)return;
  G.board[si].ids=smartSortIds(G.board[si].ids,G.sel);
  G.sel=[];
  render();setMsg('');
}

function doNewSet(){
  if(G.sel.length===0)return;
  // Vérifier seulement si c'est clairement invalide (ex: 2 mêmes couleurs dans groupe)
  // On laisse passer les sets partiels — la validation finale au ✓ vérifiera tout
  // Valider en triant d'abord (isRun est positionnel)
  if(G.sel.length>=3){
    // Valider dans l'ordre de sélection (respecte la position du joker)
    // ET dans l'ordre trié (pour les suites sans joker)
    const hasJokerSel=G.sel.some(id=>G.allTiles[id].c==='joker');
    const validAsIs=isValid(G.sel); // ordre de sélection
    const validSorted=isValid(sortSetIds(G.sel)); // ordre trié
    if(!validAsIs&&!validSorted){
      const selTiles=G.sel.map(id=>G.allTiles[id]).filter(t=>t.c!=='joker');
      const cols=selTiles.map(t=>t.c);
      const hasDupColor=cols.length!==new Set(cols).size;
      const nums=new Set(selTiles.map(t=>t.n));
      if(hasDupColor&&nums.size===1){setMsg(t().err_invalid);return;}
      // Sinon laisser passer (set partiel)
    }
  }
  // La validation finale au ✓ vérifiera que le plateau est valide
  // Calculer finalIds AVANT removeSelFromSources
  // Toujours trier les suites (chiffres différents), joker intercalé au bon endroit
  // Toujours trier sauf si joker en première position (intentionnel)
  const hasLeadingJoker2=G.sel.length>0&&G.allTiles[G.sel[0]].c==='joker';
  const finalIds=hasLeadingJoker2?[...G.sel]:sortSetIds([...G.sel]);
  saveSnap();
  if(removeSelFromSources()===false)return;
  G.board.push({owner:G.curP, ids:finalIds});
  G.sel=[];
  render();setMsg('');
}

/* ── Actions ── */
function placedIds(){
  // Diff par comptage d'occurrences (gère les doublons comme joker_1 présent 2x)
  const bkCount={};
  G.bkBoard.flatMap(e=>e.ids).forEach(id=>{bkCount[id]=(bkCount[id]||0)+1;});
  const nowCount={};
  G.board.flatMap(e=>e.ids).forEach(id=>{nowCount[id]=(nowCount[id]||0)+1;});
  const result=[];
  for(const id of Object.keys(nowCount)){
    const diff=(nowCount[id]||0)-(bkCount[id]||0);
    for(let i=0;i<diff;i++)result.push(id);
  }
  return result;
}

function tileScore(id,setIds){
  const t=G.allTiles[id];
  if(t.c!=='joker')return t.n;
  if(!setIds)return 30; // joker en main = 30
  // valeur du joker = valeur des autres tuiles du set
  const nonJ=setIds.filter(i=>G.allTiles[i].c!=='joker');
  if(nonJ.length===0)return 30;
  // groupe : même chiffre → joker vaut ce chiffre
  const nums=nonJ.map(i=>G.allTiles[i].n);
  const uniq=[...new Set(nums)];
  if(uniq.length===1)return uniq[0];
  // suite : trouver le chiffre que remplace ce joker selon sa position
  const sorted=nums.sort((a,b)=>a-b);
  const min=sorted[0],max=sorted[sorted.length-1];
  // trous internes
  const holes=[];
  for(let n=min;n<=max;n++) if(!sorted.includes(n)) holes.push(n);
  if(holes.length>0)return holes[0];
  // joker en extrémité : déterminer via sa position dans le set
  const myPos=setIds.indexOf(id);
  const firstNonJPos=setIds.findIndex(i=>G.allTiles[i].c!=='joker');
  // si le joker est avant le premier non-joker → vaut min-1
  // si le joker est après → vaut max+1
  if(myPos<firstNonJPos) return min-1;
  return max+1;
}

function doValidate(){
  // Effacer highlights IA à chaque validation
  G.board.forEach(e=>delete e.aiNew);G.aiAddedIds=[];
  // on peut valider même après avoir pioché
  const placed=placedIds();
  // Après pioche, on ne peut plus poser — passer directement
  if(G.drew){
    if(placed.length>0){
      setMsg(LANG==='fr'?'Après avoir pioché, tu ne peux plus poser de tuiles ce tour.':'After drawing, you cannot play tiles this turn.');
      return;
    }
    showPass();return;
  }
  if(placed.length===0){setMsg(t().err_nothing);return;}

  // Vérifier TOUS les sets du plateau (y compris ceux modifiés par déplacement)
  const invalidSets=G.board.filter(e=>!isValid(e.ids));
  if(invalidSets.length>0){
    setMsg(t().err_invalid);
    return;
  }

  if(G.firstPlay[G.curP]){
    const pts=placed.reduce((a,id)=>{
      const entry=G.board.find(e=>e.ids.includes(id));
      return a+tileScore(id, entry?entry.ids:null);
    },0);
    if(pts<30){
      setMsg(t().err_30pts(pts));
      G.board=dc(G.bkBoard);
      placed.forEach(id=>G.hands[G.curP].push(id));
      G.sel=[];render();return;
    }
  }

  G.scores[G.curP]+=placed.reduce((a,id)=>{
    const entry=G.board.find(e=>e.ids.includes(id));
    return a+tileScore(id, entry?entry.ids:null);
  },0);
  // vérifier que le joker récupéré a été reposé
  if(G.jokerMustPlay){
    const jokerOnBoard=G.board.some(e=>e.ids.includes(G.jokerMustPlay));
    if(!jokerOnBoard){
      setMsg(t().err_joker_must_play);return;
    }
  }
  G.firstPlay[G.curP]=false;
  G.bkBoard=dc(G.board);
  G.drawnId=null;G.drew=false;G.sel=[];G.jokerMustPlay=null;
  if(G.hands[G.curP].length===0){endGame();return;}
  showPass();
}

function doDraw(){
  if(placedIds().length>0){setMsg(t().err_cancel_placed);return;}
  if(G.pool.length===0){setMsg(t().err_pool);return;}
  const tile=G.pool.pop();
  G.allTiles[tile.id]=tile;
  G.hands[G.curP].push(tile.id);
  G.drawnId=tile.id;
  G.drew=true;
  G.bkBoard=dc(G.board);
  G.sel=[];
  setMsg('');render();
}

function doCancel(){
  // Restaurer le plateau à son état de début de tour
  G.board=dc(G.bkBoard);

  // Reconstruire la main : bkHand + tuile piochée ce tour (si elle existe)
  G.hands[G.curP]=dc(G.bkHand);

  // Si le joueur a pioché ce tour, garder la tuile piochée dans la main
  if(G.drawnId&&G.allTiles[G.drawnId]){
    if(!G.hands[G.curP].includes(G.drawnId)){
      G.hands[G.curP].push(G.drawnId);
    }
  }

  // Récupérer les tuiles retirées du plateau (ex: joker remplacé) qui ne sont pas dans bkHand
  const bkCount={};G.bkBoard.flatMap(e=>e.ids).forEach(id=>{bkCount[id]=(bkCount[id]||0)+1;});
  const nowCount={};G.board.flatMap(e=>e.ids).forEach(id=>{nowCount[id]=(nowCount[id]||0)+1;});
  Object.keys(bkCount).forEach(id=>{
    const diff=(bkCount[id]||0)-(nowCount[id]||0);
    for(let i=0;i<diff;i++){
      if(!G.hands[G.curP].includes(id))G.hands[G.curP].push(id);
    }
  });

  G.sel=[];G.drawnId=null;G.history=[];G.jokerMustPlay=null;
  document.getElementById('bundo').disabled=true;
  render();setMsg(t().cancelled);
}

function showPass(){
  // Si des tuiles ont été posées ce tour → forcer la validation ✓
  if(placedIds().length>0){
    setMsg(LANG==='fr'?'Tu as posé des tuiles — clique ✓ pour valider et compter les points.':'You placed tiles — tap ✓ to validate and score points.');
    return;
  }
  G.sel=[];
  G.nextP=(G.curP+1)%2;
  doAfterPass(); // TEST MODE : pas d'écran intermédiaire
}

function doAfterPass(){
  document.getElementById('passov').classList.remove('on');
  G.curP=G.nextP;
  if(G.curP===0)G.turn++;
  G.bkBoard=dc(G.board);
  G.bkHand=dc(G.hands[G.curP]);
  G.drawnId=null;G.sel=[];G.drew=false;G.history=[];G.jokerMustPlay=null;
  document.getElementById('bundo').disabled=true;
  // highlight IA effacé à la validation, pas ici
  render();setMsg('');
  // Déclencher l'IA si c'est le tour du joueur 2
  if(G.aiJustDrew>0)G.aiJustDrew--;
  if(G.aiMode&&G.curP===1&&!G.aiJustDrew)setTimeout(aiPlay,600);
}

function updateStaticText(){
  const el=document.getElementById('pass-sub');
  if(el)el.textContent=t().pass_sub;
  const pok=document.getElementById('pok');
  if(pok)pok.textContent=t().pass_ready;
  const wrep=document.getElementById('wrep');
  if(wrep)wrep.textContent=t().replay;
}

function endGame(){
  const winner=G.curP;
  const loser=(G.curP+1)%2;
  const pen=G.hands[loser].reduce((a,id)=>a+tileScore(id),0);
  G.scores[loser]=Math.max(0, G.scores[loser]-pen);
  document.getElementById('wmsg').textContent=t().wins(winner+1,loser+1,pen,G.scores[winner],G.scores[loser]);
  document.getElementById('winov').classList.add('on');
  // Afficher les scores automatiquement après 1.5s
  setTimeout(()=>{
    document.getElementById('winov').classList.remove('on');
    endShowScores();
  },1500);
}

function setMsg(m){document.getElementById('msg').textContent=m;}
function boardBgClick(e){
  // Créer nouveau set si on clique sur le fond (pas sur une tuile ou un set)
  const tgt=e.target;
  const onBoard=tgt===document.getElementById('board');
  const onSets=tgt===document.getElementById('sets')||tgt===document.getElementById('sets2');
  const onHint=tgt===document.getElementById('hint');
  if((onBoard||onSets||onHint)&&G.sel.length>0)doNewSet();
}

function showApps(){
  const grid=document.getElementById('apps-grid');
  if(grid.childElementCount>0){document.getElementById('appsov').style.display='block';return;}
  APPS.forEach(app=>{
    const a=document.createElement('a');
    a.href='https://apps.apple.com/app/id'+app.id;
    a.target='_blank';
    a.style.cssText='display:flex;flex-direction:column;align-items:center;gap:5px;text-decoration:none;';
    const img=document.createElement('img');
    img.style.cssText='width:56px;height:56px;border-radius:13px;background:#1e293b;';
    img.alt=app.name;
    // load icon via JSONP
    const cbName='appcb'+app.id;
    window[cbName]=function(d){
      if(d.results&&d.results[0])img.src=d.results[0].artworkUrl60;
    };
    const s=document.createElement('script');
    s.src='https://itunes.apple.com/lookup?id='+app.id+'&callback='+cbName;
    document.body.appendChild(s);
    const name=document.createElement('div');
    name.style.cssText='font-size:8px;color:rgba(255,255,255,.7);text-align:center;line-height:1.2;width:64px;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;';

  document.getElementById('appsov').style.display='block';
}

}

function toggleAI(){
  G.aiMode=!G.aiMode;
  const btn=document.getElementById('bai');
  btn.style.color=G.aiMode?'#4ade80':'rgba(255,255,255,.7)';
  btn.style.borderColor=G.aiMode?'#4ade80':'rgba(255,255,255,.3)';
  btn.textContent=G.aiMode?'IA ✓':'IA';
  if(G.aiMode&&G.curP===1)setTimeout(aiPlay,500);
}

// ── IA Niveau 2 ──────────────────────────────────────────────
function aiPlay(){
  if(!G.aiMode||G.curP!==1)return;
  setMsg('IA réfléchit...');
  // Simuler un tour complet : poser autant de tuiles que possible
  aiPlayFullTurn();
}

function aiHandTiles(){
  return G.hands[1].map(id=>({id,...G.allTiles[id]}));
}

function aiPlayFullTurn(){
  G.aiRecoveredJoker=null;
  // Sauvegarder l'état initial pour rollback propre
  const initialBoard=dc(G.board);
  const initialHand=dc(G.hands[1]);
  const initialScore=G.scores[1];
  let moved=true;
  let totalPts=0;
  let moves=[];
  let firstPlayScore=0;

  const maxMoves=30;
  let moveCount=0;
  const aiStart=Date.now();
  while(moved&&moveCount<maxMoves){
    if(Date.now()-aiStart>3000){console.warn('IA timeout');break;} // sécurité 3s
    moved=false;
    moveCount++;
    G._firstPlayScoreCtx=firstPlayScore;
    const move=aiFindBestMove();
    if(move){
      const boardBefore=dc(G.board);
      const h0Before=dc(G.hands[0]);
      const h1Before=dc(G.hands[1]);
      const wasFirstPlay=G.firstPlay[1];
      aiApplyMove(move);
      // Vérifier que tous les sets sont valides après le move
      const invalidAfter=G.board.filter(e=>e.ids.length>0&&!isValid(e.ids));
      if(invalidAfter.length>0){
        console.warn('IA move invalide annulé:',move.type);
        G.board=boardBefore;G.hands[0]=h0Before;G.hands[1]=h1Before;
        moved=false;
      } else {
        totalPts+=move.score;
        moves.push(move);
        moved=true;
        if(wasFirstPlay){
          firstPlayScore+=move.score;
          if(firstPlayScore>=30){
            G.firstPlay[1]=false;
          } else {
            G.firstPlay[1]=true;
            if(moveCount>10)break;
          }
        }
        if(G.hands[1].length===0)break;
      }
    }
  }

  // Si première pose et score < 30 → annuler tous les moves et piocher
  if(G.firstPlay[1]&&firstPlayScore<30&&moves.length>0){
    G.board=initialBoard;
    G.bkBoard=dc(initialBoard); // remettre aussi bkBoard pour que placedIds()=0
    G.hands[1]=initialHand;
    G.scores[1]=initialScore;
    G.aiAddedIds=[];
    moves=[];
    totalPts=0;
    firstPlayScore=0;
  }

  if(moves.length===0){
    // Rien à jouer → piocher
    if(G.pool.length>0){
      const tile=G.pool.pop();
      G.allTiles[tile.id]=tile;
      G.hands[1].push(tile.id);
      G.drawnId=tile.id;
      G.bkBoard=dc(G.board);
      G.aiJustDrew=2; // bloquer 2 passes (J1+J2)
      setMsg('IA pioche.');
      render();
      setTimeout(()=>{G.drawnId=null;showPass();},900);
    } else {
      setMsg('IA : pioche vide.');
      showPass();
    }
    return;
  }

  // Sauvegarder l'état final (après tous les moves)
  const finalBoard=dc(G.board);
  const finalHand=dc(G.hands[1]);
  const finalHand0=dc(G.hands[0]);
  const finalScores=[...G.scores];
  const finalFirstPlay=[...G.firstPlay];

  // Rejouer l'animation depuis l'état initial
  G.board=initialBoard;
  G.hands[1]=initialHand;
  G.hands[0]=finalHand0; // J1 non modifié
  G.scores[1]=initialScore;
  G.firstPlay[1]=true; // sera mis à jour pendant l'anim
  G.aiAddedIds=[];

  let animIdx=0;
  let animFPS=0;

  function playNextAnim(){
    if(animIdx>=moves.length){
      // Restaurer l'état final exact
      G.board=finalBoard;
      G.hands[1]=finalHand;
      G.hands[0]=finalHand0;
      G.scores=[...finalScores];
      G.firstPlay=[...finalFirstPlay];
      G.bkBoard=dc(G.board);
      render();
      if(G.hands[1].length===0){endGame();return;}
      setMsg('IA joue '+moves.length+' coup'+(moves.length>1?'s':'')+' (+'+totalPts+' pts).');
      setTimeout(()=>showPass(),1200);
      return;
    }
    const move=moves[animIdx++];
    const wasFP=G.firstPlay[1];
    aiApplyMove(move);
    if(wasFP){
      animFPS+=move.score;
      G.firstPlay[1]=animFPS>=30?false:true;
    }
    render();
    setMsg('IA — coup '+animIdx+'/'+moves.length+' : +'+move.score+' pts');
    setTimeout(playNextAnim, 1200);
  }

  setMsg('IA réfléchit...');
  setTimeout(playNextAnim, 300);
}

function aiFindBestMove(){
  const hand=aiHandTiles();
  const firstPlayScoreCtx=G._firstPlayScoreCtx||0;
  // Exclure le joker récupéré ce tour (ne pas le rejouer immédiatement)
  const jokers=hand.filter(t=>t.c==='joker'&&t.id!==G.aiRecoveredJoker);
  const candidates=[];

  // ── A. Nouveaux sets depuis la main ──
  // Suites
  COLS.forEach(col=>{
    const colT=hand.filter(t=>t.c===col).sort((a,b)=>a.n-b.n);
    const seen=new Set();
    const uniq=colT.filter(t=>{if(seen.has(t.n))return false;seen.add(t.n);return true;});
    for(let i=0;i<uniq.length;i++){
      let run=[uniq[i]];let jUsed=0;let lastN=uniq[i].n;
      for(let j=i+1;j<uniq.length;j++){
        const gap=uniq[j].n-lastN-1;
        if(gap===0){run.push(uniq[j]);lastN=uniq[j].n;}
        else if(gap>0&&gap<=jokers.length-jUsed){
          for(let k=0;k<gap;k++){run.push(jokers[jUsed]);jUsed++;}
          run.push(uniq[j]);lastN=uniq[j].n;
        } else break;
      }
      if(run.length>=3){
        const sc=aiScore(run.map(t=>t.id));
        candidates.push({type:'newset',ids:run.map(t=>t.id),score:sc});
      }
    }
  });
  // Groupes
  // Exclure les jokers récupérés ce tour des newsets (laisser pour tour suivant)
  const aiJokers=hand.filter(t=>t.c==='joker'&&G.jokerMustPlay===t.id);
  const byNum={};
  hand.forEach(t=>{if(t.c!=='joker'){if(!byNum[t.n])byNum[t.n]=[];byNum[t.n].push(t);}});
  Object.keys(byNum).forEach(n=>{
    const tiles=byNum[n];
    const uniqCols=[...new Set(tiles.map(t=>t.c))];
    if(uniqCols.length+jokers.length>=3){
      const group=uniqCols.slice(0,4).map(c=>tiles.find(t=>t.c===c));
      const need=Math.max(0,3-group.length);
      const used=[...group,...jokers.slice(0,need)];
      if(used.length>=3){
        const sc=aiScore(used.map(t=>t.id));
        candidates.push({type:'newset',ids:used.map(t=>t.id),score:sc});
      }
    }
  });

  // ── B. Récupérer un joker du tapis en le remplaçant par une tuile de la main ──
  G.board.forEach((entry,si)=>{
    const setIds=entry.ids;
    setIds.forEach((boardId,pos)=>{
      if(!G.allTiles[boardId]||G.allTiles[boardId].c!=='joker')return;
      // Trouver la valeur que vaut ce joker (position dans la suite)
      const nonJ=setIds.filter(id=>G.allTiles[id].c!=='joker').map(id=>G.allTiles[id]);
      if(nonJ.length===0)return;
      const nums=nonJ.map(t=>t.n).sort((a,b)=>a-b);
      const col=nonJ[0].c;
      // Chercher les trous dans la suite
      const full=[];
      for(let n=nums[0];n<=nums[nums.length-1];n++)full.push(n);
      const holes=full.filter(n=>!nums.includes(n));
      // Joker aux extrémités
      if(holes.length===0){
        // joker avant min ou après max
        const jokerVals=[nums[0]-1,nums[nums.length-1]+1].filter(n=>n>=1&&n<=13);
        jokerVals.forEach(jokerVal=>{
          const match=hand.find(t=>t.c===col&&t.n===jokerVal);
          if(match){
            const newSetIds=setIds.map(id=>id===boardId?match.id:id);
            if(isValid(sortSetIds(newSetIds))){
              candidates.push({
                type:'recoverjok',
                si,jokerPos:pos,jokerBoardId:boardId,
                replaceId:match.id,
                score:jokerVal+15
              });
            }
          }
        });
      } else {
        holes.forEach(jokerVal=>{
          const match=hand.find(t=>t.c===col&&t.n===jokerVal);
          if(match){
            const newSetIds=setIds.map(id=>id===boardId?match.id:id);
            if(isValid(sortSetIds(newSetIds))){
              candidates.push({
                type:'recoverjok',
                si,jokerPos:pos,jokerBoardId:boardId,
                replaceId:match.id,
                score:jokerVal+15
              });
            }
          }
        });
      }
    });
  });

  // ── B2. Récupérer un joker en utilisant une tuile extraite du tapis ──
  // Ex: groupe de quatre 2 → extraire un 2 pour remplacer le joker dans 1,★,3,4
  G.board.forEach((entry,si)=>{
    const setIds=entry.ids;
    setIds.forEach((boardId,pos)=>{
      if(!G.allTiles[boardId]||G.allTiles[boardId].c!=='joker')return;
      const nonJ=setIds.filter(id=>G.allTiles[id].c!=='joker').map(id=>G.allTiles[id]);
      if(nonJ.length===0)return;
      const nums=nonJ.map(t=>t.n).sort((a,b)=>a-b);
      const col=nonJ[0].c;
      const full=[];
      for(let n=nums[0];n<=nums[nums.length-1];n++)full.push(n);
      const holes=full.filter(n=>!nums.includes(n));
      const jokerVals=holes.length>0?holes:[nums[0]-1,nums[nums.length-1]+1].filter(n=>n>=1&&n<=13);
      jokerVals.forEach(jokerVal=>{
        // Chercher sur le tapis un set qui contient la tuile de remplacement
        G.board.forEach((srcEntry,srcSi)=>{
          if(srcSi===si)return; // pas le même set
          const srcIds=srcEntry.ids;
          srcIds.forEach(srcId=>{
            const srcT=G.allTiles[srcId];
            if(!srcT||srcT.c!==col||srcT.n!==jokerVal)return;
            // Vérifier que le set source reste valide sans cette tuile
            const remaining=srcIds.filter(id=>id!==srcId);
            if(remaining.length<3||!isValid(remaining))return;
            // Vérifier que le set cible devient valide avec cette tuile
            const newSetIds=setIds.map(id=>id===boardId?srcId:id);
            if(!isValid(sortSetIds(newSetIds)))return;
            candidates.push({
              type:'boardextract_recoverjok',
              si,jokerPos:pos,jokerBoardId:boardId,
              srcSi,replaceId:srcId,
              score:jokerVal+20 // bonus élevé
            });
          });
        });
      });
    });
  });

  // ── C. Prendre une tuile du tapis pour compléter avec la main ──
  const has30b=!G.firstPlay[1];
  // Pour chaque tuile extractible du tapis, voir si elle forme un set avec la main
  G.board.forEach((entry,si)=>{
    const setIds=entry.ids;
    // Vérifier qu'on peut retirer une tuile (set reste valide avec ≥3 tuiles)
    setIds.forEach((boardTileId,ti)=>{
      const remaining=setIds.filter((_,i)=>i!==ti);
      if(remaining.length<3||!isValid(remaining))return;
      // La tuile extraite + tuiles de la main → nouveau set ?
      const extracted=G.allTiles[boardTileId];
      if(extracted.c==='joker')return; // les jokers ont leurs propres règles
      // Chercher des combinaisons avec cette tuile + main
      const augmentedHand=[...hand,{id:boardTileId,...extracted}];
      const augJokers=augmentedHand.filter(t=>t.c==='joker');
      // Suites avec la tuile extraite
      COLS.forEach(col=>{
        if(extracted.c!==col)return;
        const colT=augmentedHand.filter(t=>t.c===col).sort((a,b)=>a.n-b.n);
        const seen2=new Set();
        const uniq2=colT.filter(t=>{if(seen2.has(t.n))return false;seen2.add(t.n);return true;});
        for(let i=0;i<uniq2.length;i++){
          // Seuls les runs contenant la tuile extraite
          if(!uniq2.slice(i).some(t=>t.id===boardTileId)&&uniq2[i].id!==boardTileId)continue;
          let run=[uniq2[i]];let jUsed=0;let lastN=uniq2[i].n;
          for(let j=i+1;j<uniq2.length;j++){
            const gap=uniq2[j].n-lastN-1;
            if(gap===0){run.push(uniq2[j]);lastN=uniq2[j].n;}
            else if(gap>0&&gap<=augJokers.length-jUsed){
              for(let k=0;k<gap;k++){run.push(augJokers[jUsed]);jUsed++;}
              run.push(uniq2[j]);lastN=uniq2[j].n;
            } else break;
          }
          if(run.length>=3&&run.some(t=>t.id===boardTileId)){
            const sc=run.reduce((a,t)=>a+(t.c==='joker'?lastN:t.n),0);
            // S'assurer que les autres tuiles du run sont dans la main (pas du plateau)
            const otherIds=run.filter(t=>t.id!==boardTileId).map(t=>t.id);
            const allInHand=otherIds.every(id=>G.hands[1].includes(id));
            if(allInHand){
              candidates.push({
                type:'extract',
                fromSi:si,
                extractId:boardTileId,
                ids:[boardTileId,...otherIds],
                score:sc
              });
            }
          }
        }
      });
      // Groupes avec la tuile extraite
      const byNum2={};
      augmentedHand.forEach(t=>{if(t.c!=='joker'){if(!byNum2[t.n])byNum2[t.n]=[];byNum2[t.n].push(t);}});
      const n=extracted.n;
      if(byNum2[n]){
        const tiles2=byNum2[n];
        const uniqCols2=[...new Set(tiles2.map(t=>t.c))];
        if(uniqCols2.length>=3){
          const group2=uniqCols2.slice(0,4).map(c=>tiles2.find(t=>t.c===c));
          if(group2.some(t=>t.id===boardTileId)){
            const otherIds=group2.filter(t=>t.id!==boardTileId).map(t=>t.id);
            const allInHand=otherIds.every(id=>G.hands[1].includes(id));
            if(allInHand){
              const sc=group2.reduce((a,t)=>a+t.n,0);
              candidates.push({
                type:'extract',
                fromSi:si,
                extractId:boardTileId,
                ids:[boardTileId,...otherIds],
                score:sc
              });
            }
          }
        }
      }
    });
  });

  // ── C. Scinder un set (split) pour y insérer une tuile de la main ──
  G.board.forEach((entry,si)=>{
    const setIds=entry.ids;
    if(!isRun(setIds))return;
    if(setIds.length<5)return; // min 5 pour avoir 2 sets de 3 après split+insert
    hand.forEach(handTile=>{
      if(handTile.c==='joker')return;
      const tileN=handTile.n;
      const setTiles=setIds.map(id=>G.allTiles[id]);
      const colEntry=setTiles.find(t=>t&&t.c!=='joker');
      if(!colEntry||handTile.c!==colEntry.c)return;
      for(let splitPos=3;splitPos<=setIds.length-3;splitPos++){
        const part1=setIds.slice(0,splitPos);
        const part2=setIds.slice(splitPos);
        // Les deux parties doivent être valides sans la tuile insérée
        if(!isValid(part1)||!isValid(part2))continue;
        // Test ajout en fin de part1
        const test1=sortSetIds([...part1,handTile.id]);
        if(isValid(test1)){
          candidates.push({type:'splitinsert',si,splitPos,handId:handTile.id,insertAt:'end1',score:tileN*2+10});
        }
        // Test ajout en début de part2
        const test2=sortSetIds([handTile.id,...part2]);
        if(isValid(test2)){
          candidates.push({type:'splitinsert',si,splitPos,handId:handTile.id,insertAt:'start2',score:tileN*2+10});
        }
      }
    });
  });

  G.board.forEach((entry,si)=>{
    const setIds=entry.ids;
    if(setIds.length<4)return; // besoin d'au moins 4 tuiles pour scinder et garder 2 sets valides
    // Essayer de retirer 1 tuile (reste ≥3 valide) et la combiner avec la main
    setIds.forEach((boardId,pos)=>{
      const t=G.allTiles[boardId];
      if(!t||t.c==='joker')return;
      const remaining=setIds.filter((_,i)=>i!==pos);
      if(remaining.length<3||!isValid(remaining))return;
      // Cette tuile peut être extraite — chercher des combos avec la main
      const augHand=[...hand,{id:boardId,...t}];
      const augJokers=jokers;
      // Suites avec la tuile extraite
      COLS.forEach(col=>{
        if(t.c!==col)return;
        const colT=augHand.filter(x=>x.c===col).sort((a,b)=>a.n-b.n);
        const seen=new Set();
        const uniq=colT.filter(x=>{if(seen.has(x.n))return false;seen.add(x.n);return true;});
        for(let i=0;i<uniq.length;i++){
          if(!uniq.slice(i).some(x=>x.id===boardId)&&uniq[i].id!==boardId)continue;
          let run=[uniq[i]];let jUsed=0;let lastN=uniq[i].n;
          for(let j=i+1;j<uniq.length;j++){
            const gap=uniq[j].n-lastN-1;
            if(gap===0){run.push(uniq[j]);lastN=uniq[j].n;}
            else if(gap>0&&gap<=augJokers.length-jUsed){
              for(let k=0;k<gap;k++){run.push(augJokers[jUsed]);jUsed++;}
              run.push(uniq[j]);lastN=uniq[j].n;
            } else break;
          }
          if(run.length>=3&&run.some(x=>x.id===boardId)){
            const otherIds=run.filter(x=>x.id!==boardId).map(x=>x.id);
            if(otherIds.every(id=>G.hands[1].includes(id))){
              const sc=run.reduce((a,x)=>a+(x.c==='joker'?lastN:x.n),0);
              candidates.push({type:'splitextract',fromSi:si,extractId:boardId,ids:[boardId,...otherIds],score:sc});
            }
          }
        }
      });
      // Groupes avec la tuile extraite
      const sameNum=augHand.filter(x=>x.n===t.n&&x.c!=='joker');
      const uniqCols=[...new Set(sameNum.map(x=>x.c))];
      if(uniqCols.length>=3){
        const group=uniqCols.slice(0,4).map(c=>sameNum.find(x=>x.c===c));
        if(group.some(x=>x.id===boardId)){
          const otherIds=group.filter(x=>x.id!==boardId).map(x=>x.id);
          if(otherIds.every(id=>G.hands[1].includes(id))){
            const sc=group.reduce((a,x)=>a+x.n,0);
            candidates.push({type:'splitextract',fromSi:si,extractId:boardId,ids:[boardId,...otherIds],score:sc});
          }
        }
      }
    });
  });

  // ── D. Extraire 2 tuiles de 2 sets différents + main pour groupe ──
  hand.forEach(handTile=>{
    if(handTile.c==='joker')return;
    const n=handTile.n;
    // Chercher toutes les tuiles de même valeur extractibles du tapis
    const extractable=[];
    G.board.forEach((entry,si)=>{
      const setIds=entry.ids;
      setIds.forEach((boardId,pos)=>{
        const t=G.allTiles[boardId];
        if(!t||t.c==='joker'||t.n!==n||t.c===handTile.c)return;
        const remaining=setIds.filter((_,i)=>i!==pos);
        if(remaining.length>=3&&isValid(remaining)){
          extractable.push({si,boardId,col:t.c});
        }
      });
    });
    // Combiner la tuile de main avec 2 tuiles du tapis → groupe
    for(let i=0;i<extractable.length;i++){
      // 1 extrait + main → déjà couvert par splitextract
      // 2 extraits + main → groupe de 3 couleurs différentes
      for(let j=i+1;j<extractable.length;j++){
        const e1=extractable[i],e2=extractable[j];
        if(e1.col===e2.col||e1.col===handTile.c||e2.col===handTile.c)continue;
        // Vérifier que les 2 retraits sont compatibles (sets différents ou set reste valide)
        if(e1.si===e2.si){
          // Même set — vérifier qu'on peut retirer les 2
          const setIds=G.board[e1.si].ids;
          const remaining=setIds.filter(id=>id!==e1.boardId&&id!==e2.boardId);
          if(remaining.length<3||!isValid(remaining))continue;
        }
        const groupIds=[handTile.id,e1.boardId,e2.boardId];
        if(isGroup(groupIds.map(id=>({id,...(G.allTiles[id]||{c:'?',n:0})})).map(x=>x.id))){
          candidates.push({
            type:'multiextract',
            extracts:[{si:e1.si,boardId:e1.boardId},{si:e2.si,boardId:e2.boardId}],
            handId:handTile.id,
            ids:[handTile.id,e1.boardId,e2.boardId],
            score:n*3+5
          });
        }
      }
    }
  });

  // ── E. Ajouter aux sets existants (y compris adversaire si ≥30pts) ──
  const has30=has30b;
  G.board.forEach((entry,si)=>{
    if(!has30&&entry.owner!==1)return; // pas toucher adversaire avant 30pts
    const setIds=entry.ids;
    hand.forEach(t=>{
      if(t.c==='joker')return;
      const testIds=sortSetIds([...setIds,t.id]);
      if(isValid(testIds)){
        candidates.push({type:'addtoset',si,ids:[t.id],score:t.n});
      }
    });
    // Ajouter plusieurs tuiles d'un coup
    const extras=hand.filter(t=>t.c!=='joker'); // pas de joker dans addtoset
    for(let i=0;i<extras.length;i++){
      for(let j=i+1;j<extras.length;j++){
        const testIds=sortSetIds([...setIds,extras[i].id,extras[j].id]);
        if(isValid(testIds)){
          candidates.push({type:'addtoset',si,ids:[extras[i].id,extras[j].id],score:(extras[i].n+extras[j].n)*2});
        }
        // 3 tuiles ensemble
        for(let k=j+1;k<extras.length;k++){
          const testIds3=sortSetIds([...setIds,extras[i].id,extras[j].id,extras[k].id]);
          if(isValid(testIds3)){
            candidates.push({type:'addtoset',si,ids:[extras[i].id,extras[j].id,extras[k].id],score:(extras[i].n+extras[j].n+extras[k].n)*3});
          }
        }
      }
    }
  });

  if(candidates.length===0)return null;

  // Première pose : besoin de 30pts min au total avec nouveaux sets
  if(G.firstPlay[1]){
    const newsets=candidates.filter(c=>c.type==='newset').sort((a,b)=>b.score-a.score);

    // Chercher un set unique >= 30 pts
    for(const c of newsets){
      if(c.score>=30)return c;
    }
    // Sinon : trouver une combinaison de sets sans tuiles en commun dont le total >= 30
    for(let i=0;i<newsets.length;i++){
      const usedIds=new Set(newsets[i].ids);
      let comboScore=newsets[i].score;
      for(let j=0;j<newsets.length;j++){
        if(j===i)continue;
        if(newsets[j].ids.every(id=>!usedIds.has(id))){
          newsets[j].ids.forEach(id=>usedIds.add(id));
          comboScore+=newsets[j].score;
          if(comboScore>=30)break;
          // Chercher un 3ème set
          for(let k=0;k<newsets.length;k++){
            if(k===i||k===j)continue;
            if(newsets[k].ids.every(id=>!usedIds.has(id))){
              comboScore+=newsets[k].score;
              newsets[k].ids.forEach(id=>usedIds.add(id));
              break;
            }
          }
          if(comboScore>=30)break;
        }
      }
      if(comboScore>=30)return newsets[i];
    }
    return null;
  }

  // Dédupliquer les candidats (même type+ids)
  const seen2=new Set();
  const unique=candidates.filter(c=>{
    const key=c.type+':'+(c.ids||[c.handId||c.replaceId||'']).join(',')+(c.si!=null?':'+c.si:'');
    if(seen2.has(key))return false;
    seen2.add(key);return true;
  });
  unique.sort((a,b)=>b.score-a.score);
  return unique[0]||null;
}

function aiScore(ids){
  return ids.reduce((a,id)=>{
    const entry=G.board.find(e=>e.ids.includes(id));
    return a+tileScore(id,entry?entry.ids:null);
  },0);
}

function aiApplyMove(move){
  if(move.type==='multiextract'){
    // Retirer la tuile de la main
    const hi=G.hands[1].indexOf(move.handId);
    if(hi>=0)G.hands[1].splice(hi,1);
    // Retirer les tuiles des sets sources (du plus grand index au plus petit pour éviter décalage)
    const sorted=[...move.extracts].sort((a,b)=>b.si-a.si);
    sorted.forEach(({si,boardId})=>{
      if(!G.board[si])return;
      G.board[si].ids=G.board[si].ids.filter(id=>id!==boardId);
      if(G.board[si].ids.length===0)G.board.splice(si,1);
    });
    // Créer le nouveau set
    G.board.push({owner:1,ids:sortSetIds(move.ids)});
    const nsi=G.board.length-1;
    sortSetIds(move.ids).forEach((_,ti)=>G.aiAddedIds.push({si:nsi,ti}));
    G.scores[1]+=move.score;
    // firstPlay handled by aiPlayFullTurn
  } else if(move.type==='boardextract_recoverjok'){
    // Retrouver les sets par leurs tuiles (les indices peuvent avoir changé)
    const srcSet=G.board.find(e=>e.ids.includes(move.replaceId));
    const tgtSet=G.board.find(e=>e.ids.includes(move.jokerBoardId));
    if(!srcSet||!tgtSet)return;
    // Retirer la tuile du set source
    srcSet.ids=srcSet.ids.filter(id=>id!==move.replaceId);
    if(srcSet.ids.length===0){
      const idx=G.board.indexOf(srcSet);
      if(idx>=0)G.board.splice(idx,1);
    }
    // Remplacer le joker par la tuile extraite dans le set cible
    const jIdx=tgtSet.ids.indexOf(move.jokerBoardId);
    if(jIdx>=0)tgtSet.ids[jIdx]=move.replaceId;
    tgtSet.ids=sortSetIds(tgtSet.ids);
    // Le joker va en main de l'IA
    G.hands[1].push(move.jokerBoardId);
    G.aiRecoveredJoker=move.jokerBoardId;
    const pts=G.allTiles[move.replaceId]?G.allTiles[move.replaceId].n:0;
    G.scores[1]+=pts;
    move.score=pts;
  } else if(move.type==='recoverjok'){
    // Remplacer le joker par la tuile de la main
    const hi=G.hands[1].indexOf(move.replaceId);
    if(hi>=0)G.hands[1].splice(hi,1);
    G.board[move.si].ids[move.jokerPos]=move.replaceId;
    G.board[move.si].ids=sortSetIds(G.board[move.si].ids);
    // Le joker récupéré va en main (sera utilisé au tour suivant)
    G.hands[1].push(move.jokerBoardId);
    G.aiRecoveredJoker=move.jokerBoardId;
    const pts=G.allTiles[move.replaceId].n;
    G.scores[1]+=pts;
    // firstPlay handled by aiPlayFullTurn
    move.score=pts;
    G.aiAddedIds.push({si:move.si,ti:G.board[move.si].ids.indexOf(move.replaceId)});
  } else if(move.type==='extract'){
    // Si la tuile extraite est un joker, mémoriser pour ne pas le rejouer ce tour
    if(G.allTiles[move.extractId]&&G.allTiles[move.extractId].c==='joker'){
      G.aiRecoveredJoker=move.extractId;
    }
    // Retirer la tuile du set source
    const fromSi=move.fromSi;
    G.board[fromSi].ids=G.board[fromSi].ids.filter(id=>id!==move.extractId);
    if(G.board[fromSi].ids.length===0)G.board.splice(fromSi,1);
    // Retirer les autres tuiles de la main
    move.ids.filter(id=>id!==move.extractId).forEach(id=>{
      const i=G.hands[1].indexOf(id);
      if(i>=0)G.hands[1].splice(i,1);
    });
    // Créer le nouveau set
    G.board.push({owner:1,ids:sortSetIds(move.ids)});
    const nsi=G.board.length-1;
    sortSetIds(move.ids).forEach((_,ti)=>G.aiAddedIds.push({si:nsi,ti}));
    const pts=move.score;
    G.scores[1]+=pts;
    // firstPlay handled by aiPlayFullTurn
    move.score=pts;
  } else if(move.type==='splitinsert'){
    // Scinder la suite et insérer la tuile de la main
    // Retrouver le set par son si (peut avoir changé)
    const splitSet=G.board[move.si];
    if(!splitSet){return;}
    const setIds=[...splitSet.ids];
    const part1=setIds.slice(0,move.splitPos);
    const part2=setIds.slice(move.splitPos);
    // Retirer la tuile de la main
    const hiSplit=G.hands[1].indexOf(move.handId);
    if(hiSplit>=0)G.hands[1].splice(hiSplit,1);
    // Remplacer le set original et créer le nouveau
    if(move.insertAt==='end1'){
      G.board[move.si].ids=sortSetIds([...part1,move.handId]);
      G.board.push({owner:1,ids:part2});
    } else {
      G.board[move.si].ids=part1;
      G.board.push({owner:1,ids:sortSetIds([move.handId,...part2])});
    }
    // Marquer la tuile ajoutée
    const targetSiSplit=move.insertAt==='end1'?move.si:G.board.length-1;
    const tiSplit=G.board[targetSiSplit].ids.indexOf(move.handId);
    if(tiSplit>=0)G.aiAddedIds.push({si:targetSiSplit,ti:tiSplit});
    G.scores[1]+=G.allTiles[move.handId]?G.allTiles[move.handId].n:0;
  } else if(move.type==='newset'){
    move.ids.forEach(id=>{
      const i=G.hands[1].indexOf(id);
      if(i>=0)G.hands[1].splice(i,1);
    });
    G.board.push({owner:1,ids:[...move.ids]});
    const nsi2=G.board.length-1;
    move.ids.forEach((_,ti)=>G.aiAddedIds.push({si:nsi2,ti}));
    const pts=aiScore(move.ids);
    G.scores[1]+=pts;
    // firstPlay handled by aiPlayFullTurn
    move.score=pts;
  } else if(move.type==='addtoset'){
    // Retrouver le set par ses ids en cas de réindexation du board
    const actualSi=G.board.findIndex(e=>e.ids.length===G.board[move.si]?.ids.length&&
      move.ids.every(id=>!e.ids.includes(id))&&
      sortSetIds([...e.ids,...move.ids]).length===e.ids.length+move.ids.length&&
      isValid(sortSetIds([...e.ids,...move.ids])));
    const targetSi=actualSi>=0?actualSi:move.si;
    if(!G.board[targetSi]){return;} // set introuvable, ignorer
    move.ids.forEach(id=>{
      const i=G.hands[1].indexOf(id);
      if(i>=0)G.hands[1].splice(i,1);
    });
    const newIds=sortSetIds([...G.board[targetSi].ids,...move.ids]);
    G.board[targetSi].ids=newIds;
    move.si=targetSi;
    // marquer les positions des tuiles ajoutées dans le set
    move.ids.forEach(id=>{
      const ti=G.board[move.si].ids.indexOf(id);
      if(ti>=0)G.aiAddedIds.push({si:move.si,ti});
    });
    // Recalculer score des tuiles ajoutées
    const pts=move.ids.reduce((a,id)=>{
      const t=G.allTiles[id];return a+(t.c==='joker'?30:t.n);
    },0);
    G.scores[1]+=pts;
    move.score=pts;
  }
}


// ── Scores persistants ───────────────────────────────────────
const SCORE_KEY='tuiles_scores';

function loadStoredScores(){
  try{
    const s=localStorage.getItem(SCORE_KEY);
    return s?JSON.parse(s):[];
  }catch(e){return[];}
}

function saveAndReplay(){
  saveScores();
  closeScores();
  document.getElementById('winov').classList.remove('on');
  initGame();
}

function endShowScores(){
  // Sauvegarder et afficher les scores avec boutons rejouer
  saveScores();
  showScores();
  // Ajouter boutons rejouer en bas du panneau scores
  const body=document.getElementById('scores-body');
  const btns=document.createElement('div');
  btns.style.cssText='display:flex;gap:10px;margin-top:20px';
  btns.innerHTML='<button onclick="closeScores();document.getElementById(\'winov\').classList.remove(\'on\');initGame();" style="flex:1;padding:12px;background:#185FA5;color:#fff;border:none;border-radius:22px;font-size:14px;font-weight:700;cursor:pointer">↺ Rejouer</button>';
  body.appendChild(btns);
}

function showScores(){
  const stored=loadStoredScores();

  html+='<div style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px">'+(LANG==='fr'?'Partie en cours':'Current game')+'</div>';

  const isMac=window.innerWidth>=1024;

  html+='<div style="font-size:'+vsFontSize+'px;color:rgba(255,255,255,.2);text-align:center">vs</div>';
  html+='<div style="text-align:left;padding-left:8px"><div style="color:#fb923c;font-weight:700;font-size:'+labelFontSize+'px">'+p2+'</div><div style="font-size:'+scoreFontSize+'px;font-weight:900;color:#fff;line-height:1">'+G.scores[1]+'</div><div style="font-size:12px;color:rgba(255,255,255,.5)">pts</div></div>';
  html+='</div></div>';

  // Historique
  if(stored.length>0){
    html+='<div style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:8px;text-transform:uppercase;letter-spacing:.5px">'+(LANG==='fr'?'Historique':'History')+'</div>';
    let tot1=0,tot2=0;
    stored.slice().reverse().forEach((g,i)=>{
      tot1+=g.s1;tot2+=g.s2;
      let win='=';
      if(g.winner===0)win='🏆 '+p1;
      else if(g.winner===1)win='🏆 '+(g.p2||p2);
      else win=g.s1>g.s2?'🏆 '+p1:g.s2>g.s1?'🏆 '+(g.p2||p2):'=';
      const hfs=isMac?24:isLarge?20:14;
      const dfs=isMac?14:isLarge?13:11;
      const p2label=g.p2||p2;
      // Ligne entête colonnes si première ligne
      if(i===0)html+='<div style="display:grid;grid-template-columns:1.2fr 0.8fr 24px 0.8fr 0.8fr;gap:12px;padding:4px 0;font-size:'+dfs+'px"><span style="color:rgba(255,255,255,.5)">Date</span><span style="color:#60a5fa;font-weight:700;text-align:left">'+p1+'</span><span style="text-align:center;color:rgba(255,255,255,.3)">vs</span><span style="color:#fb923c;font-weight:700;text-align:left">'+p2label+'</span><span></span></div>';

      html+='<span style="font-size:'+dfs+'px;color:#fff">'+g.date+'</span>';
      html+='<span style="color:#60a5fa;font-weight:700;font-size:'+hfs+'px;text-align:left">'+g.s1+'</span>';

      html+='<span style="font-size:'+dfs+'px;color:var(--gold);text-align:left">'+win+'</span>';

    html+='<span></span>';
    html+='</div>';
  } else {
    html+='<div style="color:rgba(255,255,255,.4);text-align:center;padding:16px">'+(LANG==='fr'?'Aucune partie mémorisée.':'No saved games yet.')+'</div>';
  }

  document.getElementById('scores-body').innerHTML=html;
  document.getElementById('scoresov').style.display='block';
}

function closeScores(){
  document.getElementById('scoresov').style.display='none';
}

function saveScores(){
  const stored=loadStoredScores();
  const p2=G.aiMode?(LANG==='fr'?'IA':'AI'):(LANG==='fr'?'Joueur 2':'Player 2');
  const now=new Date();
  const date=now.toLocaleDateString('fr-FR',{day:'2-digit',month:'2-digit',year:'2-digit',hour:'2-digit',minute:'2-digit'});
  // Le gagnant est celui qui a vidé sa main (G.curP au moment de endGame)
  // On le déduit : la main vide = winner
  const winner=G.hands[0].length===0?0:(G.hands[1].length===0?1:-1);
  stored.push({s1:G.scores[0],s2:G.scores[1],p2,date,winner});
  if(stored.length>20)stored.shift(); // max 20 parties
  try{localStorage.setItem(SCORE_KEY,JSON.stringify(stored));}catch(e){}
  showScores();
  setMsg(LANG==='fr'?'Score mémorisé !':'Score saved!');
}

function resetScores(){
  try{localStorage.removeItem(SCORE_KEY);}catch(e){}
  showScores();
  setMsg(LANG==='fr'?'Scores remis à 0.':'Scores reset.');
}

function doSplit(){
  if(G.sel.length!==1)return;
  const id=G.sel[0];
  // trouver le set et la position
  let foundSi=-1,foundTi=-1;
  for(let si=0;si<G.board.length;si++){
    const ti=G.board[si].ids.indexOf(id);
    if(ti>=0){foundSi=si;foundTi=ti;break;}
  }
  if(foundSi<0)return;
  const setIds=G.board[foundSi].ids;
  // couper avant la tuile sélectionnée : [0..ti-1] et [ti..end]
  const part1=setIds.slice(0,foundTi);
  const part2=setIds.slice(foundTi);
  // vérifier que les deux parties sont valides (>=3 tuiles chacune)
  if(part1.length<1){setMsg('Sélectionne une tuile après la 1ère.');return;}
  if(part2.length<1){setMsg('Sélectionne une tuile avant la dernière.');return;}
  // Les parties incomplètes (<3) sont autorisées — on validera au ✓
  saveSnap();
  const owner=G.board[foundSi].owner;
  G.board.splice(foundSi,1,
    {owner, ids:part1},
    {owner, ids:part2}
  );
  G.sel=[];
  render();setMsg('Set coupé en deux !');
}

// ── Ampoule : chercher combinaisons dans la main ─────────────
function findCombinations(){
  const hand=G.hands[G.curP].map(id=>({id,...G.allTiles[id]}));
  const results=[];

  // ── Groupes (même chiffre, couleurs différentes) ──
  const byNum={};
  hand.forEach(t=>{
    if(t.c==='joker')return;
    if(!byNum[t.n])byNum[t.n]=[];
    byNum[t.n].push(t);
  });
  const jokers=hand.filter(t=>t.c==='joker');

  Object.keys(byNum).forEach(n=>{
    const tiles=byNum[n];
    const uniqCols=[...new Set(tiles.map(t=>t.c))];
    if(uniqCols.length+jokers.length>=3){
      // prendre 1 tuile par couleur + jokers si besoin
      const group=uniqCols.slice(0,4).map(c=>tiles.find(t=>t.c===c));
      const need=Math.max(0,3-group.length);
      const used=[...group,...jokers.slice(0,need)];
      if(used.length>=3){
        results.push({type:'group',tiles:used,score:used.reduce((a,t)=>a+(t.c==='joker'?parseInt(n):t.n),0)});
      }
      // groupe de 4 si possible
      if(uniqCols.length>=4){
        const group4=uniqCols.slice(0,4).map(c=>tiles.find(t=>t.c===c));
        results.push({type:'group4',tiles:group4,score:group4.reduce((a,t)=>a+t.n,0)});
      }
    }
  });

  // ── Suites (même couleur, consécutives) ──
  COLS.forEach(col=>{
    const colTiles=hand.filter(t=>t.c===col).sort((a,b)=>a.n-b.n);
    const seen=new Set();
    const uniq=colTiles.filter(t=>{if(seen.has(t.n))return false;seen.add(t.n);return true;});
    for(let i=0;i<uniq.length;i++){
      let run=[uniq[i]];
      let jUsed=0;
      let lastN=uniq[i].n;
      for(let j=i+1;j<uniq.length;j++){
        const gap=uniq[j].n-lastN-1;
        if(gap===0){
          // consécutif direct — ajouter
          run.push(uniq[j]);
          lastN=uniq[j].n;
        } else if(gap>0&&gap<=jokers.length-jUsed){
          // trou comblable par jokers
          for(let k=0;k<gap;k++){run.push(jokers[jUsed]);jUsed++;}
          run.push(uniq[j]);
          lastN=uniq[j].n;
        } else {
          break;
        }
      }
      // aussi essayer d'ajouter un joker au début ou à la fin
      if(run.length>=2&&jUsed<jokers.length){
        const firstN=uniq[i].n;
        if(firstN>1){
          const withBefore=[jokers[jUsed],...run];
          if(withBefore.length>=3)results.push({type:'run',tiles:withBefore,
            score:withBefore.reduce((a,t)=>a+(t.c==='joker'?firstN-1:t.n),0)});
        }
        if(lastN<13){
          const withAfter=[...run,jokers[jUsed]];
          if(withAfter.length>=3)results.push({type:'run',tiles:withAfter,
            score:withAfter.reduce((a,t)=>a+(t.c==='joker'?lastN+1:t.n),0)});
        }
      }
      if(run.length>=3){
        const sc=run.reduce((a,t,idx)=>{
          if(t.c!=='joker')return a+t.n;
          // trouver la valeur du joker selon sa position
          const prev=run.slice(0,idx).reverse().find(x=>x.c!=='joker');
          return a+(prev?prev.n+1:uniq[i].n-1);
        },0);
        results.push({type:'run',tiles:run,score:sc});
      }
    }
  });

  // Trier par score décroissant
  results.sort((a,b)=>b.score-a.score);
  return results;
}

function tileHtml(t){
  // Utiliser la classe .tile pour hériter des media queries responsive
  return '<div class="tile" data-c="'+t.c+'" style="display:inline-flex;margin:2px;flex-shrink:0">'+(t.c==='joker'?'★':t.n)+'</div>';
}

  const combos=findCombinations();
  const title=LANG==='fr'?'Combinaisons possibles':'Possible combinations';
  document.getElementById('hint-title').textContent=title;
  const body=document.getElementById('hint-body');
  if(combos.length===0){
    body.innerHTML='<div style="color:rgba(255,255,255,.6);text-align:center;padding:20px">'+(LANG==='fr'?'Aucune combinaison trouvée dans ta main.':'No combinations found in your hand.')+'</div>';
  } else {
    const typeLabel={run:LANG==='fr'?'Suite':'Run',group:LANG==='fr'?'Groupe':'Group',group4:LANG==='fr'?'Groupe de 4':'Group of 4'};
    body.innerHTML=combos.map((c,i)=>
      '<div style="background:rgba(255,255,255,.07);border-radius:10px;padding:10px 12px;margin-bottom:10px">'
      +'<div style="font-size:12px;color:rgba(255,255,255,.5);margin-bottom:6px">'+(typeLabel[c.type]||c.type)+' — '+c.score+' pts</div>'
      +'<div>'+c.tiles.map(t=>tileHtml(t)).join('')+'</div>'
      +'</div>'
    ).join('');
  }
  document.getElementById('hintov').style.display='block';
}

function toggleSpy(){
  const btn=document.getElementById('bspy');
  G.spyMode=!G.spyMode;
  btn.style.background=G.spyMode?'#b45309':'#7c3aed';
  btn.title=G.spyMode?'Voir mon jeu':'Voir jeu IA';
  // Afficher la main de l'adversaire
  const spyP=G.curP===0?1:0;
  const ht=document.getElementById('htiles');
  if(!ht)return;
  ht.innerHTML='';
  const htitle=document.getElementById('htitle');
  if(G.spyMode){
    if(htitle)htitle.textContent=(LANG==='fr'?'Main — Joueur ':'Hand — Player ')+(spyP+1);
    // Trier la main de l'IA : par couleur puis par chiffre, jokers à la fin
    const sorted=[...G.hands[spyP]].sort((a,b)=>{
      const ta=G.allTiles[a],tb=G.allTiles[b];
      if(ta.c==='joker')return 1;
      if(tb.c==='joker')return -1;
      const colOrder=['red','blue','black','orange'];
      const cd=colOrder.indexOf(ta.c)-colOrder.indexOf(tb.c);
      return cd!==0?cd:ta.n-tb.n;
    });
    sorted.forEach((id,i)=>ht.appendChild(makeHandTileEl(id,i)));
  } else {
    if(htitle)htitle.textContent=(LANG==='fr'?'Main — Joueur ':'Hand — Player ')+(G.curP+1);
    G.hands[G.curP].forEach((id,i)=>ht.appendChild(makeHandTileEl(id,i)));
  }
}
